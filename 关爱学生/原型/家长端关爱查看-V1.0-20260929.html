<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家长端 · 关爱查看</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#172b4a;font-size:14px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#dcebf9,#fff5e9);min-height:100vh;display:flex;align-items:center;justify-content:center}.phone{width:390px;max-width:100vw;height:844px;max-height:100vh;border:10px solid #131d2c;border-radius:48px;background:#f1f6fd;box-shadow:0 20px 45px #11223b30;overflow:hidden;display:flex;flex-direction:column}.status{height:33px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;font-size:13px}.head{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px}.head b{font-size:18px}.back{border:0;background:none;font-size:22px;color:#152d53;padding:0 4px;line-height:1;cursor:pointer}.head .right{margin-left:auto;color:#7185a4;font-size:12px}.view{display:none;min-height:0;flex:1;flex-direction:column}.view.active{display:flex}.body{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 18px}.home-banner{background:linear-gradient(110deg,#2065dd,#40b7ec);color:#fff;border-radius:15px;padding:22px 18px;margin:9px 0 16px}.home-banner h1{font-size:20px;margin:0 0 8px}.home-banner p{margin:0;line-height:1.7;font-size:12px}.section{font-weight:700;margin:16px 0 10px;color:#526988;font-size:13px}.home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.menu{background:#fff;border:0;border-radius:12px;padding:15px 0 12px;box-shadow:0 3px 12px #25446a0a;color:#233b5f;cursor:pointer}.menu span{display:grid;place-items:center;margin:0 auto 8px;width:38px;height:38px;border-radius:12px;background:#e8f1ff;color:#2d77ea;font-size:20px}.menu b{font-size:12px}.tabs{height:45px;background:#fff;display:flex;flex:none}.tabs button{width:50%;border:0;border-bottom:2px solid transparent;background:#fff;color:#91a1b6;cursor:pointer}.tabs button.on{border-color:#2d75ea;color:#2d75ea;font-weight:700}.search{background:#fff;border:1px solid #dfebf6;border-radius:25px;padding:11px 14px;width:100%;font:inherit;outline:none;margin:13px 0 7px}.note{font-size:12px;color:#8a9db8;margin:4px 0 12px}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #1833530b}.case{cursor:pointer}.student{display:flex;align-items:center;gap:12px;margin-bottom:10px}.avatar{width:42px;height:42px;border-radius:50%;background:#dbe9f7;display:grid;place-items:center;font-size:21px}.student b{font-size:17px}.sub{font-size:12px;color:#91a5c0;margin-top:4px}.tag{display:inline-block;border-radius:4px;background:#fff1dc;color:#ba7500;font-size:11px;padding:2px 6px;vertical-align:2px}.tag.done{background:#e1f7f3;color:#139f90}.kv{display:flex;align-items:flex-start;gap:4px;padding:5px 0;line-height:20px;font-size:13px}.kv .k{flex:0 0 80px;color:#8ca1be}.kv .v{flex:1;min-width:0;overflow-wrap:anywhere}.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.long{white-space:normal}.record-head{display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid #eef3f8;margin-bottom:7px}.record-head b{font-size:13px}.record-head time{margin-left:auto;font-size:12px;color:#8a9fba}.thumbs{display:grid;grid-template-columns:repeat(3,58px);gap:8px}.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:5px;border:1px solid #e1e8f2;cursor:zoom-in}.empty{padding:54px 12px;text-align:center;color:#96a7bc}.preview{position:fixed;inset:0;background:#000d;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.preview.on{display:flex}.preview img{max-width:100%;max-height:85vh;object-fit:contain}.preview button{position:absolute;right:16px;top:16px;background:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:22px}.footer{height:61px;flex:none;background:#fff;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #e7edf6}.footer span{font-size:12px;color:#8a9db8}.footer span.on{color:#2d75ea;font-weight:700}@media(max-width:420px){body{background:#f1f6fd}.phone{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>▰ ᴡɪғɪ ▰</span></div>
<section id="parent-home" class="view active"><header class="head"><b>家校共育</b><span class="right">家长端</span></header><div class="body"><div class="home-banner"><h1>陪伴孩子每一步成长</h1><p>查看已认领孩子的本学年关爱个案</p></div><div class="section">服务入口</div><div class="home-grid"><button class="menu" type="button" onclick="openPage('parent-care')"><span>♡</span><b>关爱</b></button></div><div class="section">我的孩子</div><div id="claimed-list"></div></div><div class="footer"><span class="on">首页</span><span>消息</span><span>我的</span></div></section>
<section id="parent-care" class="view"><header class="head"><button class="back" type="button" aria-label="返回首页" onclick="openPage('parent-home')">‹</button><b>关爱</b></header><div class="tabs"><button type="button" class="on" onclick="setTab(this,'all')">全部</button><button type="button" onclick="setTab(this,'need')">待跟进</button></div><div class="body"><input id="parent-query" class="search" placeholder="搜索学生姓名" oninput="renderCases()"><div class="note" id="parent-count"></div><div id="parent-case-list"></div></div></section>
<section id="parent-detail" class="view"><header class="head"><button class="back" type="button" aria-label="返回关爱" onclick="openPage('parent-care')">‹</button><b>关爱个案详情</b></header><div class="body" id="parent-detail-body"></div></section></main>
<div class="preview" id="parent-preview" onclick="if(event.target===this)this.classList.remove('on')"><button type="button" aria-label="关闭原图" onclick="document.getElementById('parent-preview').classList.remove('on')">×</button><img alt="证明材料原图"></div>
<script>
(function(){
 var range=window.CARE_ACADEMIC_YEAR_RANGE||{start:'2026-09-01',end:'2027-08-31'};
 var claimed=window.CARE_CLAIMED_CHILDREN||[{studentId:'demo-zhang',name:'张小明',grade:'七年级（2025级）',klass:'2班',claimStatus:'success'}];
 var cases=window.CARE_PARENT_CASES||[{id:'case-zhang-1',studentId:'demo-zhang',name:'张小明',grade:'七年级（2025级）',klass:'2班',createdDate:'2026-09-18',records:[{date:'2026-09-18',people:'王老师、李老师、陈老师',type:'家庭关怀',method:'家访',result:'已与家长沟通返校安排，约定持续关注返校适应情况。',proofs:[],follow:'需要',next:'2026-09-25'},{date:'2026-09-23',people:'王老师、李老师、陈老师',type:'返校适应',method:'面谈',result:'已与学生面谈返校适应情况，约定下周继续关注。',proofs:[],follow:'需要',next:'2026-09-30'}]}];
 var current=null,tab='all';
 function el(id){return document.getElementById(id)}
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function visible(){var ids=new Set(claimed.filter(function(x){return x.claimStatus==='success'||x.claimStatus==='claimed'||x.claimed===true}).map(function(x){return x.studentId}));return cases.filter(function(c){return ids.has(c.studentId)&&c.createdDate>=range.start&&c.createdDate<=range.end})}
 function latest(c){return c.records.slice().sort(function(a,b){return b.date.localeCompare(a.date)})[0]}
 function row(k,v,cls){return '<div class="kv"><span class="k">'+esc(k)+'</span><span class="v '+(cls||'')+'">'+esc(v||'--')+'</span></div>'}
 function student(c){return '<div class="student"><div class="avatar">👦</div><div><b>'+esc(c.name)+'</b> <span class="tag '+(latest(c).follow==='需要'?'':'done')+'">'+(latest(c).follow==='需要'?'待跟进':'已完结')+'</span><div class="sub">'+esc(c.grade+' · '+c.klass)+'</div></div></div>'}
 window.openPage=function(id){document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('active',x.id===id)});location.hash=id;if(id==='parent-care')renderCases();if(id==='parent-home')renderClaimed()};
 window.setTab=function(button,value){tab=value;document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===button)});renderCases()};
 window.renderCases=function(){var q=el('parent-query').value.trim(),all=visible(),list=all.filter(function(c){return (!q||c.name.indexOf(q)>=0)&&(tab==='all'||latest(c).follow==='需要')});el('parent-count').textContent='本学年共 '+all.length+' 个关爱个案';el('parent-case-list').innerHTML=list.map(function(c,i){var last=latest(c);return '<article class="card case" tabindex="0" data-case-index="'+i+'">'+student(c)+row('创建日期',c.createdDate)+row('关爱次数',c.records.length+'次')+row('最近关爱',last.date)+row('关爱结果',last.result,'clamp')+'</article>'}).join('')||'<div class="empty">暂无符合条件的关爱个案</div>';el('parent-case-list').querySelectorAll('[data-case-index]').forEach(function(card){var c=list[Number(card.dataset.caseIndex)];card.onclick=function(){window.parentCaseDetail(c.id)};card.onkeydown=function(e){if(e.key==='Enter')window.parentCaseDetail(c.id)}})};
 window.parentCaseDetail=function(id){var c=visible().find(function(x){return x.id===id});if(!c)return;current=c;var list=c.records.slice().sort(function(a,b){return b.date.localeCompare(a.date)});el('parent-detail-body').innerHTML='<div class="section">基本信息</div><div class="card">'+student(c)+row('创建日期',c.createdDate)+row('关爱次数',list.length+'次')+'</div><div class="section">关爱情况（共'+list.length+'次）</div>'+list.map(function(r,i){var images=(r.proofs||[]).slice(0,9);return '<div class="card"><div class="record-head"><b>第'+(list.length-i)+'次关爱</b><time>'+esc(r.date)+'</time></div>'+row('关爱日期',r.date)+row('实施人员',r.people)+row('关爱类型',r.type)+row('关爱方式',r.method)+row('关爱结果',r.result,'long')+'<div class="kv"><span class="k">证明材料</span><span class="v">'+(images.length?'<span class="thumbs">'+images.map(function(src,j){return '<img src="'+esc(src)+'" alt="证明材料'+(j+1)+'" onclick="parentPreview(this.src)">' }).join('')+'</span>':'--')+'</span></div>'+row('继续跟进',r.follow==='需要'?'需要':'暂不需要')+(r.follow==='需要'?row('下次跟进日期',r.next):'')+'</div>'}).join('');openPage('parent-detail')};
 window.parentPreview=function(src){el('parent-preview').querySelector('img').src=src;el('parent-preview').classList.add('on')};
 function renderClaimed(){el('claimed-list').innerHTML=claimed.filter(function(x){return x.claimStatus==='success'||x.claimStatus==='claimed'||x.claimed===true}).map(function(x){return '<div class="card">'+esc(x.name)+'<div class="sub">'+esc(x.grade+' · '+x.klass)+'</div></div>'}).join('')||'<div class="empty">暂无认领成功的孩子</div>'}
 renderClaimed();if(location.hash==='#parent-care'||location.hash==='#parent-detail')openPage('parent-care');
})();
</script></body></html>
